name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Lint audit (legacy issues are tracked separately)
        continue-on-error: true
        run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run db:local
      - name: Start local app
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/travel-memory.log 2>&1 &
          echo $! > /tmp/travel-memory.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/travel-memory.log
          exit 1
      - run: npm run test:integration
      - run: npm run test:exif
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/travel-memory.log || true
