name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Cloudflare deployment secrets
        id: secrets
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
          fi
      - name: Verify before deployment
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Deploy Worker and provision D1/R2 bindings
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Apply D1 migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
      - name: Deployment summary
        if: steps.secrets.outputs.ready == 'true'
        run: echo "Travel Memory deployment completed. Open the Cloudflare Workers deployment URL shown above."
